<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Génosociogramme · Sylvia Besuchet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#F7F3EE;font-family:Georgia,serif;}
@keyframes spin{to{transform:rotate(360deg)}}
input,select,textarea{font-family:Georgia,serif;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useEffect,useRef}=React;
const C={cream:"#F7F3EE",creamDark:"#EDE7DC",bordeaux:"#5A2E2A",gold:"#A66A3F",goldLight:"#C4904F",text:"#2C1A18",muted:"#8A6A60"};
const CODE="sylvia2024";
const EJS_SVC="service_9zw6spc",EJS_TPL="template_c3nsg5y",EJS_KEY="gmcGZWPzhkTpnEMvP";
const GENS=["Mes arrière-arrière-grands-parents","Mes arrière-grands-parents","Mes grands-parents et leurs fratries","Mes parents et leurs fratries","Ma fratrie","Moi"];
const GKEYS=["gggp","ggp","gp","parents","fratrie","vous"];
const LIENS=["— Choisir —","Moi","Mère","Père","Sœur","Frère","Grand-mère maternelle","Grand-père maternel","Grand-mère paternelle","Grand-père paternel","Tante maternelle","Oncle maternel","Tante paternelle","Oncle paternel","Fille","Fils","Conjoint·e","Autre"];
const MALADIES=["Cancer","Maladie cardiovasculaire","Maladie de sang","Alcoolisme / addiction","Dépression / troubles psychiatriques","Diabète","Maladie auto-immune","Troubles alimentaires","Maladie neurologique","Non-filiation suspectée","Secret lié à la santé","Autre"];
const ORDRES=["1er","2e","3e","4e","Inconnu"];

const EP=()=>({id:crypto.randomUUID(),prenom:"",autresPrenoms:"",ordreEtatCivil:"1er",nom:"",nomNaissance:"",dateNaissance:"",dateDeces:"",genre:"F",lien:"",rangFratrie:"",fratrie:"",metier:"",evenements:"",maladies:[],secretsNondits:"",problematique:""});
const ET=()=>({gggp:[EP(),EP(),EP(),EP()],ggp:[EP(),EP(),EP(),EP()],gp:[EP(),EP()],parents:[EP(),EP()],fratrie:[],vous:[EP()],projetSens:{contexteConception:"",grossesse:"",naissance:"",premiersMois:""}});

const SK="sylvia_geno_v2";
function loadC(){try{return JSON.parse(localStorage.getItem(SK)||"[]");}catch{return[];}}
function saveC(c){localStorage.setItem(SK,JSON.stringify(c));}

function treeToText(tree){
  const lines=GKEYS.map((gk,i)=>{
    const ps=(tree[gk]||[]).filter(p=>p.prenom||p.dateNaissance);
    if(!ps.length)return"";
    return GENS[i]+" :\n"+ps.map(p=>{
      let s="  • "+(p.prenom||"?");
      if(p.autresPrenoms)s+=" ("+p.autresPrenoms+")";
      s+=" "+(p.nom||"");
      if(p.nomNaissance&&p.nomNaissance!==p.nom)s+=" née "+p.nomNaissance;
      if(p.ordreEtatCivil&&p.ordreEtatCivil!=="1er")s+=" ["+p.ordreEtatCivil+" EC]";
      if(p.lien)s+=" ["+p.lien+"]";
      if(p.rangFratrie)s+=" [rang "+p.rangFratrie+"]";
      if(p.fratrie)s+=" | Fratrie : "+p.fratrie;
      if(p.dateNaissance)s+=" | Né·e "+p.dateNaissance;
      if(p.dateDeces)s+=" | Décédé·e "+p.dateDeces;
      if(p.metier)s+=" | "+p.metier;
      if(p.evenements)s+=" | "+p.evenements;
      if(p.maladies&&p.maladies.length)s+=" | Maladies: "+p.maladies.join(", ");
      if(p.secretsNondits)s+=" | Secrets: "+p.secretsNondits;
      if(p.problematique)s+=" | Problématique: "+p.problematique;
      return s;
    }).join("\n");
  }).filter(Boolean).join("\n\n");
  const ps=tree.projetSens||{};
  let pt="";
  if(ps.contexteConception||ps.grossesse||ps.naissance||ps.premiersMois){
    pt="\n\nPROJET-SENS:\n";
    if(ps.contexteConception)pt+="  Conception: "+ps.contexteConception+"\n";
    if(ps.grossesse)pt+="  Grossesse: "+ps.grossesse+"\n";
    if(ps.naissance)pt+="  Naissance: "+ps.naissance+"\n";
    if(ps.premiersMois)pt+="  Premiers mois: "+ps.premiersMois+"\n";
  }
  return lines+pt;
}

async function sendEmail(nom,arbre){
  const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:EJS_SVC,template_id:EJS_TPL,user_id:EJS_KEY,template_params:{client_nom:nom,date:new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}),arbre_texte:arbre}})});
  if(!r.ok)throw new Error("EmailJS "+r.status);
}

function iS(){return{width:"100%",padding:"7px 9px",borderRadius:6,border:"1px solid #EDE7DC",background:"#fff",fontSize:13,fontFamily:"Georgia,serif",color:"#2C1A18",boxSizing:"border-box"};}
function bB(bg,col){return{background:bg||"#5A2E2A",color:col||"#F7F3EE",border:"none",padding:"10px 24px",borderRadius:20,fontSize:13,fontFamily:"Georgia,serif",cursor:"pointer"};}
const lS={fontSize:11,color:"#8A6A60",display:"block",marginBottom:4};
const pS={fontSize:13,color:"#2C1A18",lineHeight:1.6,margin:"0 0 4px"};

function FI({label,value,onChange,placeholder,type}){
  return <div><label style={lS}>{label}</label><input type={type||"text"} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""} style={iS()}/></div>;
}
function Card({title,children,accent}){
  return <div style={{background:accent?"#FFF9F4":"#fff",border:"1px solid "+(accent?"#A66A3F":"#EDE7DC"),borderRadius:14,padding:"16px 18px",marginBottom:12}}><div style={{fontSize:13,fontWeight:"bold",color:"#5A2E2A",marginBottom:10,paddingBottom:8,borderBottom:"1px solid #EDE7DC"}}>{title}</div>{children}</div>;
}
function Blk({children,last}){return <div style={{marginBottom:last?0:12,paddingBottom:last?0:12,borderBottom:last?"none":"1px solid #EDE7DC"}}>{children}</div>;}
function Tag({children,color}){return <span style={{display:"inline-block",fontSize:11,padding:"2px 9px",borderRadius:10,background:color||"#5A2E2A",color:"#F7F3EE",marginRight:4,marginBottom:4}}>{children}</span>;}
function Spin(){return <div style={{width:40,height:40,borderRadius:"50%",border:"3px solid #EDE7DC",borderTop:"3px solid #5A2E2A",animation:"spin 1s linear infinite",margin:"0 auto 12px"}}/>;}

// ── PERSONNE ────────────────────────────────────────────────────────────────
function PersonCard({person,genKey,onUpdate,onToggleMaladie,onRemove,isEditing,onToggleEdit}){
  const u=(f,v)=>onUpdate(genKey,person.id,f,v);
  const hideOEC=["vous","fratrie","parents","gp"].includes(genKey);
  const sum=person.prenom?(person.prenom+(person.autresPrenoms?" ("+person.autresPrenoms+")":"")+" "+(person.nom||"")+(person.dateNaissance?" · "+person.dateNaissance:"")+(person.dateDeces?" †"+person.dateDeces:"")):"Nouvelle personne";
  return(
    <div style={{border:"1px solid "+(isEditing?"#A66A3F":"#EDE7DC"),borderRadius:10,marginBottom:10,overflow:"hidden"}}>
      <div onClick={onToggleEdit} style={{padding:"9px 13px",background:isEditing?"#FFF9F4":"#F7F3EE",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:15}}>{person.genre==="M"?"♂":"♀"}</span>
          <span style={{fontSize:13,color:person.prenom?"#2C1A18":"#8A6A60"}}>{sum}</span>
        </div>
        <span style={{fontSize:11,color:"#A66A3F"}}>{isEditing?"Fermer ▲":"Éditer ▼"}</span>
      </div>
      {isEditing&&<div style={{padding:14,background:"#FFF9F4"}}>
        <div style={{background:"#FFF3E0",border:"1px solid #C4904F",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:11,color:"#7A4A2A",lineHeight:1.5}}>
          📋 <strong>Où trouver ces infos ?</strong> Livret de famille · Geneanet.org · Archives départementales · Registres paroissiaux
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <FI label="Prénom usuel" value={person.prenom} onChange={v=>u("prenom",v)} placeholder="Prénom au quotidien"/>
          <FI label="Autres prénoms (état civil)" value={person.autresPrenoms} onChange={v=>u("autresPrenoms",v)} placeholder="ex : Marie, Jeanne"/>
          {!hideOEC&&<div>
            <label style={lS}>Ordre état civil</label>
            <select value={person.ordreEtatCivil} onChange={e=>u("ordreEtatCivil",e.target.value)} style={iS()}>
              {ORDRES.map(o=><option key={o}>{o}</option>)}
            </select>
          </div>}
          <FI label="Rang dans la fratrie" value={person.rangFratrie} onChange={v=>u("rangFratrie",v)} placeholder="ex : 2 sur 5"/>
          {!hideOEC&&<div style={{gridColumn:"1 / -1"}}>
            <label style={lS}>Fratrie (frères et sœurs) <span style={{color:"#A66A3F",fontSize:10}}>— prénoms, âges, événements marquants</span></label>
            <textarea value={person.fratrie||""} onChange={e=>u("fratrie",e.target.value)} placeholder="ex : Jean (1945) ainé, Marie (1948) décédée jeune, Pierre (1952) alcoolique…" rows={2} style={{...iS(),resize:"vertical"}}/>
          </div>}
          <FI label="Nom de famille" value={person.nom} onChange={v=>u("nom",v)}/>
          <FI label="Nom de naissance" value={person.nomNaissance} onChange={v=>u("nomNaissance",v)} placeholder="si différent"/>
          <FI label="Date naissance (JJ/MM/AAAA)" value={person.dateNaissance} onChange={v=>u("dateNaissance",v)} placeholder="14/03/1942"/>
          <FI label="Date décès (JJ/MM/AAAA)" value={person.dateDeces} onChange={v=>u("dateDeces",v)} placeholder="si décédé·e"/>
          <div>
            <label style={lS}>Lien familial</label>
            <select value={person.lien} onChange={e=>u("lien",e.target.value)} style={iS()}>
              {LIENS.map(l=><option key={l}>{l}</option>)}
            </select>
          </div>
          <FI label="Métier" value={person.metier} onChange={v=>u("metier",v)} placeholder="ex : agriculteur…"/>
        </div>
        <div style={{marginBottom:10}}>
          <label style={lS}>Événements marquants</label>
          <textarea value={person.evenements} onChange={e=>u("evenements",e.target.value)} placeholder="deuils, ruptures, migrations, abandons…" rows={2} style={{...iS(),resize:"vertical"}}/>
        </div>
        <div style={{marginBottom:10}}>
          <label style={lS}>Secrets / non-dits</label>
          <textarea value={person.secretsNondits} onChange={e=>u("secretsNondits",e.target.value)} placeholder="adoption cachée, père inconnu, suicide tabou…" rows={2} style={{...iS(),resize:"vertical"}}/>
        </div>
        {genKey==="vous"&&<div style={{marginBottom:10}}>
          <label style={lS}>Ma problématique</label>
          <textarea value={person.problematique||""} onChange={e=>u("problematique",e.target.value)} placeholder="ce qui t'amène, ce que tu traverses en ce moment…" rows={2} style={{...iS(),resize:"vertical"}}/>
        </div>}
        <div style={{marginBottom:10}}>
          <label style={lS}>Maladies / pathologies</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:4}}>
            {MALADIES.map(m=>{
              const sel=m==="Autre"?(person.maladies&&person.maladies.some(x=>x.startsWith("Autre"))):(person.maladies&&person.maladies.includes(m));
              const onClick=()=>{
                if(m==="Autre"){
                  const txt=window.prompt("Précise la maladie / pathologie :","");
                  if(txt&&txt.trim())onToggleMaladie(genKey,person.id,"Autre : "+txt.trim());
                }else{
                  onToggleMaladie(genKey,person.id,m);
                }
              };
              return<button key={m} onClick={onClick} style={{padding:"4px 10px",borderRadius:14,border:"none",cursor:"pointer",fontSize:11,background:sel?"#5A2E2A":"#EDE7DC",color:sel?"#F7F3EE":"#2C1A18",fontFamily:"inherit"}}>{m}</button>;
            })}
            {person.maladies&&person.maladies.filter(x=>x.startsWith("Autre :")).map(x=><button key={x} onClick={()=>onToggleMaladie(genKey,person.id,x)} style={{padding:"4px 10px",borderRadius:14,border:"none",cursor:"pointer",fontSize:11,background:"#5A2E2A",color:"#F7F3EE",fontFamily:"inherit"}}>{x} ✕</button>)}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",gap:6}}>
            {["F","M"].map(g=><button key={g} onClick={()=>u("genre",g)} style={{padding:"5px 12px",borderRadius:6,border:"none",cursor:"pointer",background:person.genre===g?"#5A2E2A":"#EDE7DC",color:person.genre===g?"#F7F3EE":"#2C1A18",fontSize:12}}>{g==="F"?"♀ Féminin":"♂ Masculin"}</button>)}
          </div>
          <button onClick={onRemove} style={{background:"none",border:"none",color:"#C0392B",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>🗑 Supprimer</button>
        </div>
      </div>}
    </div>
  );
}

function GenSection({genKey,label,persons,expanded,onToggle,onUpdate,onToggleMaladie,onAdd,onRemove,editingId,setEditingId}){
  const filled=persons.filter(p=>p.prenom).length;
  return(
    <div style={{marginBottom:10,borderRadius:12,overflow:"hidden",border:"1px solid #EDE7DC"}}>
      <div onClick={onToggle} style={{background:expanded?"#5A2E2A":"#EDE7DC",color:expanded?"#F7F3EE":"#2C1A18",padding:"11px 16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:13,fontWeight:"bold"}}>{label}</span>
          {filled>0&&<span style={{background:expanded?"#C4904F":"#5A2E2A",color:"#F7F3EE",fontSize:11,padding:"2px 8px",borderRadius:10}}>{filled}</span>}
        </div>
        <span>{expanded?"▲":"▼"}</span>
      </div>
      {expanded&&<div style={{background:"#fff",padding:14}}>
        {persons.map(p=><PersonCard key={p.id} person={p} genKey={genKey} onUpdate={onUpdate} onToggleMaladie={onToggleMaladie} onRemove={()=>onRemove(p.id)} isEditing={editingId===p.id} onToggleEdit={()=>setEditingId(editingId===p.id?null:p.id)}/>)}
        <button onClick={onAdd} style={{background:"none",border:"1.5px dashed #A66A3F",color:"#A66A3F",padding:"7px 18px",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit",marginTop:4}}>+ Ajouter</button>
      </div>}
    </div>
  );
}

function ProjetSens({data,onUpdate}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{marginBottom:10,borderRadius:12,overflow:"hidden",border:"1px solid #EDE7DC"}}>
      <div onClick={()=>setOpen(o=>!o)} style={{background:open?"#5A2E2A":"#EDE7DC",color:open?"#F7F3EE":"#2C1A18",padding:"11px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:13,fontWeight:"bold"}}>🌱 Ma conception et ma naissance (mon projet sens)</span>
        <span>{open?"▲":"▼"}</span>
      </div>
      {open&&<div style={{background:"#fff",padding:14,display:"grid",gap:10}}>
        {[["contexteConception","Le contexte de ma conception","Ce qui se passait pour mes parents, leur relation, leur situation…"],["grossesse","Ma grossesse","Événements durant la grossesse, état émotionnel de ma mère…"],["naissance","Ma naissance","Conditions de ma naissance, prématuré·e, césarienne, complications…"],["premiersMois","Mes premiers mois de vie","Séparations précoces, allaitement, contexte familial immédiat…"]].map(([f,lbl,ph])=>(
          <div key={f}>
            <label style={lS}>{lbl}</label>
            <textarea value={data[f]||""} onChange={e=>onUpdate(f,e.target.value)} placeholder={ph} rows={2} style={{...iS(),resize:"vertical"}}/>
          </div>
        ))}
      </div>}
    </div>
  );
}

// ── ANALYSE IA ──────────────────────────────────────────────────────────────
function AnalyseView({analysis,loading,onRetry}){
  if(loading)return <div style={{textAlign:"center",padding:"60px 24px"}}><Spin/><p style={{color:"#8A6A60",fontStyle:"italic"}}>Analyse des patterns en cours…</p></div>;
  if(!analysis)return <div style={{textAlign:"center",padding:"60px 24px",color:"#8A6A60",fontStyle:"italic"}}>Lance l'analyse depuis l'onglet 🌳 Arbre.</div>;
  if(analysis.error)return <div style={{maxWidth:560,margin:"40px auto",padding:"0 16px",textAlign:"center"}}><p style={{color:"#C0392B",marginBottom:12}}>{analysis.error}</p><button onClick={onRetry} style={bB()}>Réessayer</button></div>;
  const sects=[
    {k:"syndromes_anniversaire",t:"📅 Syndromes d'anniversaire",r:items=>items.map((s,i)=><Blk key={i} last={i===items.length-1}><p style={pS}>{s.description}</p>{s.dates_concernees&&<Tag>{s.dates_concernees}</Tag>}{s.explication&&<p style={{fontSize:12,color:"#8A6A60",marginTop:5}}>{s.explication}</p>}</Blk>)},
    {k:"syndrome_gisant",t:"🪦 Syndrome du gisant",r:items=>items.map((s,i)=><Blk key={i} last={i===items.length-1}><p style={pS}>{s.description}</p><div style={{display:"flex",gap:6,marginTop:5,flexWrap:"wrap"}}>{s.age_ou_date&&<Tag>{s.age_ou_date}</Tag>}{s.membre_source&&<Tag color="#A66A3F">{s.membre_source}</Tag>}</div>{s.explication&&<p style={{fontSize:12,color:"#8A6A60",marginTop:5}}>{s.explication}</p>}</Blk>)},
    {k:"patterns",t:"🔄 Patterns répétitifs",r:items=>items.map((p,i)=><Blk key={i} last={i===items.length-1}><div style={{display:"flex",gap:8,marginBottom:4,alignItems:"center",flexWrap:"wrap"}}><strong style={{color:"#5A2E2A"}}>{p.titre}</strong><Tag color={p.intensite==="forte"?"#5A2E2A":p.intensite==="moyenne"?"#A66A3F":"#8A6A60"}>{p.intensite}</Tag></div><p style={pS}>{p.description}</p>{p.membres&&p.membres.length>0&&<p style={{fontSize:12,color:"#8A6A60"}}>Membres : {p.membres.join(", ")}</p>}</Blk>)},
    {k:"pistes_maladies",t:"🩺 Pistes de maladies",r:items=>items.map((m,i)=><Blk key={i} last={i===items.length-1}><strong style={{color:"#5A2E2A"}}>{m.type}</strong><p style={pS}>{m.description}</p>{m.piste_decodage&&<p style={{fontSize:13,fontStyle:"italic",color:"#A66A3F",marginTop:5}}>🔍 {m.piste_decodage}</p>}{m.membres_concernes&&m.membres_concernes.length>0&&<p style={{fontSize:12,color:"#8A6A60"}}>Membres : {m.membres_concernes.join(", ")}</p>}</Blk>)},
    {k:"loyautes_invisibles",t:"🔗 Loyautés invisibles",r:items=>items.map((l,i)=><Blk key={i} last={i===items.length-1}><p style={pS}>{l.description}</p>{l.question&&<p style={{fontSize:13,fontStyle:"italic",color:"#A66A3F",marginTop:5}}>💬 {l.question}</p>}</Blk>)},
    {k:"repetitions_prenoms",t:"🔤 Répétitions de prénoms",r:items=>items.map((r,i)=><Blk key={i} last={i===items.length-1}><strong style={{color:"#5A2E2A"}}>{r.prenom}</strong><p style={pS}>{r.interpretation}</p>{r.membres&&r.membres.length>0&&<p style={{fontSize:12,color:"#8A6A60"}}>{r.membres.join(", ")}</p>}</Blk>)},
    {k:"metiers_transmis",t:"⚒ Métiers transmis",r:items=>items.map((m,i)=><Blk key={i} last={i===items.length-1}><strong style={{color:"#5A2E2A"}}>{m.metier_ou_theme}</strong><p style={pS}>{m.interpretation}</p>{m.membres&&m.membres.length>0&&<p style={{fontSize:12,color:"#8A6A60"}}>{m.membres.join(", ")}</p>}</Blk>)},
    {k:"secrets_nondits",t:"🤫 Secrets & non-dits",r:items=>items.map((s,i)=><Blk key={i} last={i===items.length-1}><p style={pS}>{s.description}</p>{s.impact_possible&&<p style={{fontSize:12,color:"#8A6A60",marginTop:4}}>{s.impact_possible}</p>}</Blk>)},
  ];
  return(
    <div style={{maxWidth:660,margin:"0 auto",padding:"18px 14px"}}>
      {analysis.synthese&&<Card title="✦ Ce que révèle cet arbre" accent><p style={{fontStyle:"italic",lineHeight:1.75,color:"#2C1A18"}}>{analysis.synthese}</p></Card>}
      {sects.map(s=>{const items=analysis[s.k];if(!items||!items.length)return null;return<Card key={s.k} title={s.t}>{s.r(items)}</Card>;})}
      {analysis.projet_sens&&<Card title="🌱 Ma conception et ma naissance"><p style={{fontStyle:"italic",lineHeight:1.7}}>{analysis.projet_sens}</p></Card>}
      {analysis.message_liberation&&<div style={{background:"#5A2E2A",borderRadius:14,padding:"20px 22px",marginBottom:14,textAlign:"center"}}><div style={{fontSize:9,color:"#C4904F",letterSpacing:3,textTransform:"uppercase",marginBottom:8}}>Message de libération</div><p style={{color:"#F7F3EE",fontStyle:"italic",fontSize:14,lineHeight:1.8,margin:0}}>"{analysis.message_liberation}"</p></div>}
      {analysis.pistes_action&&analysis.pistes_action.length>0&&<Card title="🌿 Pistes concrètes">{analysis.pistes_action.map((a,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}><span style={{minWidth:20,height:20,borderRadius:"50%",background:"#A66A3F",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:"bold"}}>{i+1}</span><p style={{fontSize:13,margin:0,lineHeight:1.6}}>{a}</p></div>)}</Card>}
      <div style={{textAlign:"center",marginTop:18}}><button onClick={onRetry} style={bB()}>🔄 Relancer</button></div>
    </div>
  );
}

// ── NOTES ───────────────────────────────────────────────────────────────────
function NotesView({client,onAdd,onDelete}){
  const [txt,setTxt]=useState("");
  const notes=(client&&client.notes||[]).slice().reverse();
  return(

// ── DÉCODAGE PRÉNOM ─────────────────────────────────────────────────────────
function PrenomView({client,apiKey}){
  const [results,setResults]=useState({});
  const [loading,setLoading]=useState(null);
  const [err,setErr]=useState("");
  const [selected,setSelected]=useState("vous");

  const getPrenoms=()=>{
    const list=[];
    const vous=client&&client.tree&&client.tree.vous&&client.tree.vous[0];
    if(vous&&vous.prenom)list.push({key:"vous",prenom:vous.prenom,label:"Moi — "+vous.prenom});
    const parents=client&&client.tree&&client.tree.parents||[];
    parents.forEach(function(p,i){if(p.prenom)list.push({key:"parent_"+i,prenom:p.prenom,label:(p.lien||"Parent")+" — "+p.prenom});});
    return list;
  };

  const decode=async function(prenom,personKey){
    const key=apiKey||localStorage.getItem("sylvia_api_key")||"";
    if(!key){setErr("Clé API manquante.");return;}
    setLoading(personKey);setErr("");
    const sys='Tu es une experte en decodage transgenérationnel des prénoms. Reponds UNIQUEMENT en JSON valide sans backticks, reponses courtes 1-2 phrases. Structure: {"origine":"","etymologie":"","saint_fete":"","sens_cache":"","transmission_familiale":"","message_prenom":"","questions_exploration":["","",""]}';
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","anthropic-version":"2023-06-01","x-api-key":key,"anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,system:sys,messages:[{role:"user",content:"Décode le prénom \""+prenom+"\" dans ce contexte familial:\n"+treeToText(client.tree)}]})});
      if(!r.ok)throw new Error("API "+r.status);
      const d=await r.json();
      const raw=d.content&&d.content.find(function(b){return b.type==="text";})&&d.content.find(function(b){return b.type==="text";}).text||"";
      const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
      setResults(function(prev){const n={...prev};n[personKey]=parsed;return n;});
    }catch(e){setErr("Erreur : "+e.message);}
    finally{setLoading(null);}
  };

  const prenoms=getPrenoms();
  const current=prenoms.find(function(p){return p.key===selected;})||prenoms[0];
  const res=current&&results[current.key];

  return(
    <div style={{maxWidth:660,margin:"0 auto",padding:"18px 14px"}}>
      {prenoms.length>1&&<div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        {prenoms.map(function(p){return <button key={p.key} onClick={()=>setSelected(p.key)} style={{padding:"6px 14px",borderRadius:14,border:"none",cursor:"pointer",fontSize:12,background:selected===p.key?"#5A2E2A":"#EDE7DC",color:selected===p.key?"#F7F3EE":"#2C1A18",fontFamily:"inherit"}}>{p.label}</button>;})}
      </div>}
      {current&&<div style={{background:"#FFF9F4",border:"1px solid #A66A3F",borderRadius:14,padding:"20px",marginBottom:16,textAlign:"center"}}>
        <div style={{fontSize:11,color:"#A66A3F",letterSpacing:3,textTransform:"uppercase",marginBottom:8}}>Décodage transgénérationnel</div>
        <div style={{fontSize:28,color:"#5A2E2A",fontStyle:"italic",marginBottom:16}}>{current.prenom}</div>
        <button onClick={()=>decode(current.prenom,current.key)} disabled={loading===current.key} style={{...bB(),opacity:loading===current.key?0.7:1}}>{loading===current.key?"Décodage en cours…":"✨ Décoder ce prénom"}</button>
        {err&&<p style={{color:"#C0392B",fontSize:12,marginTop:8}}>{err}</p>}
      </div>}
      {loading===current.key&&<div style={{textAlign:"center",padding:"40px"}}><Spin/><p style={{color:"#8A6A60",fontStyle:"italic"}}>Analyse du prénom…</p></div>}
      {res&&<div>
        {res.origine&&<Card title="🌍 Origine & étymologie"><p style={pS}><strong>Origine :</strong> {res.origine}</p><p style={pS}>{res.etymologie}</p></Card>}
        {res.saint_fete&&<Card title="📅 Saint & fête"><p style={pS}>{res.saint_fete}</p></Card>}
        {res.transmission_familiale&&<Card title="🌳 Transmission familiale"><p style={pS}>{res.transmission_familiale}</p></Card>}
        {res.sens_cache&&<Card title="🔍 Sens caché"><p style={{fontStyle:"italic",lineHeight:1.7,fontSize:13}}>{res.sens_cache}</p></Card>}
        {res.message_prenom&&<div style={{background:"#5A2E2A",borderRadius:14,padding:"20px 22px",marginBottom:14,textAlign:"center"}}><div style={{fontSize:9,color:"#C4904F",letterSpacing:3,textTransform:"uppercase",marginBottom:8}}>Message du prénom</div><p style={{color:"#F7F3EE",fontStyle:"italic",fontSize:15,lineHeight:1.8,margin:0}}>"{res.message_prenom}"</p></div>}
        {res.questions_exploration&&res.questions_exploration.length>0&&<Card title="💬 Questions d'exploration"><ul style={{paddingLeft:16,margin:0}}>{res.questions_exploration.map(function(q,i){return <li key={i} style={{fontSize:13,lineHeight:1.7,marginBottom:4}}>{q}</li>;})}</ul></Card>}
      </div>}
    </div>
  );
}

function fmtDate(raw){
  if(!raw)return"";
  const months={JAN:"01",FEB:"02",MAR:"03",APR:"04",MAY:"05",JUN:"06",JUL:"07",AUG:"08",SEP:"09",OCT:"10",NOV:"11",DEC:"12"};
  raw=raw.replace(/^(ABT|BEF|AFT|EST|CAL)\s*/i,"").trim();
  const p=raw.split(" ").filter(Boolean);
  if(p.length===3)return p[0].padStart(2,"0")+"/"+(months[p[1].toUpperCase()]||"??")+"/"+p[2];
  if(p.length===2&&months[p[0].toUpperCase()])return"??/"+(months[p[0].toUpperCase()])+"/"+p[1];
  return raw;
}

function parseGED(text){
  const lines=text.split(/\r?\n/);
  const inds={},fams={};
  let cur=null,ct=null,ctag=null;
  lines.forEach(function(line){
    const m=line.match(/^(\d+)\s+(\S+)(?:\s+(.*))?$/);
    if(!m)return;
    const lv=parseInt(m[1]),tag=m[2],val=m[3];
    if(lv===0){
      if(tag.startsWith("@I")){cur={id:tag,prenom:"",autresPrenoms:"",nom:"",nomNaissance:"",dateNaissance:"",dateDeces:"",genre:"F",lien:"",metier:"",evenements:"",maladies:[],secretsNondits:"",ordreEtatCivil:"1er",rangFratrie:"",fams:[],famc:[]};inds[tag]=cur;ct="INDI";}
      else if(tag.startsWith("@F")){cur={id:tag,husb:null,wife:null,children:[]};fams[tag]=cur;ct="FAM";}
      else{cur=null;ct=null;}ctag=null;return;
    }
    if(!cur)return;
    if(ct==="INDI"){
      if(lv===1)ctag=tag;
      if(lv===1&&tag==="SEX")cur.genre=val==="M"?"M":"F";
      if(lv===1&&tag==="OCCU")cur.metier=val||"";
      if(lv===1&&tag==="FAMS")cur.fams.push(val);
      if(lv===1&&tag==="FAMC")cur.famc.push(val);
      if(lv===1&&tag==="NAME"&&val){const nm=val.match(/^([^/]*)\/([^/]*)\/(.*)$/);if(nm){const ps=nm[1].trim().split(" ").filter(Boolean);cur.prenom=cur.prenom||ps[0]||"";cur.autresPrenoms=cur.autresPrenoms||ps.slice(1).join(" ");cur.nom=cur.nom||nm[2].trim();}else if(!cur.prenom){cur.prenom=val.split(" ")[0]||"";}}
      if(lv===2&&ctag==="NAME"&&tag==="GIVN"){const ps=(val||"").split(" ").filter(Boolean);cur.prenom=cur.prenom||ps[0]||"";cur.autresPrenoms=cur.autresPrenoms||ps.slice(1).join(" ");}
      if(lv===2&&ctag==="NAME"&&tag==="SURN")cur.nom=cur.nom||val||"";
      if(lv===2&&ctag==="BIRT"&&tag==="DATE")cur.dateNaissance=fmtDate(val);
      if(lv===2&&ctag==="DEAT"&&tag==="DATE")cur.dateDeces=fmtDate(val);
      if(lv===1&&tag==="DEAT"&&val==="Y")cur.dateDeces=cur.dateDeces||"inconnue";
    }
    if(ct==="FAM"){
      if(lv===1&&tag==="HUSB")cur.husb=val;
      if(lv===1&&tag==="WIFE")cur.wife=val;
      if(lv===1&&tag==="CHIL")cur.children.push(val);
    }
  });
  return{inds,fams};
}

function gedToTree(inds,fams,rootId){
  const tree=ET();
  if(!rootId||!inds[rootId])return tree;
  const root={...inds[rootId],id:crypto.randomUUID(),lien:"Moi"};
  tree.vous=[root];

  function addGGP(personId){
    if(!personId||!inds[personId])return;
    const p=inds[personId];
    if(p.famc&&p.famc.length){
      const f=fams[p.famc[0]];
      if(f){
        if(f.husb&&inds[f.husb])tree.ggp.push({...inds[f.husb],id:crypto.randomUUID(),lien:"Arrière-grand-père"});
        if(f.wife&&inds[f.wife])tree.ggp.push({...inds[f.wife],id:crypto.randomUUID(),lien:"Arrière-grand-mère"});
      }
    }
  }

  if(root.famc&&root.famc.length){
    const fc=fams[root.famc[0]];
    if(fc){
      if(fc.husb&&inds[fc.husb]){
        const p={...inds[fc.husb],id:crypto.randomUUID(),lien:"Père"};
        tree.parents.push(p);
        if(p.famc&&p.famc.length){
          const gf=fams[p.famc[0]];
          if(gf){
            if(gf.husb&&inds[gf.husb]){tree.gp.push({...inds[gf.husb],id:crypto.randomUUID(),lien:"Grand-père paternel"});addGGP(gf.husb);}
            if(gf.wife&&inds[gf.wife]){tree.gp.push({...inds[gf.wife],id:crypto.randomUUID(),lien:"Grand-mère paternelle"});addGGP(gf.wife);}
          }
        }
      }
      if(fc.wife&&inds[fc.wife]){
        const m={...inds[fc.wife],id:crypto.randomUUID(),lien:"Mère"};
        tree.parents.push(m);
        if(m.famc&&m.famc.length){
          const gf=fams[m.famc[0]];
          if(gf){
            if(gf.husb&&inds[gf.husb]){tree.gp.push({...inds[gf.husb],id:crypto.randomUUID(),lien:"Grand-père maternel"});addGGP(gf.husb);}
            if(gf.wife&&inds[gf.wife]){tree.gp.push({...inds[gf.wife],id:crypto.randomUUID(),lien:"Grand-mère maternelle"});addGGP(gf.wife);}
          }
        }
      }
      fc.children.forEach(function(cid){if(cid!==rootId&&inds[cid])tree.fratrie.push({...inds[cid],id:crypto.randomUUID(),lien:inds[cid].genre==="M"?"Frère":"Sœur"});});
    }
  }
  if(tree.ggp.length===0)tree.ggp=[EP(),EP(),EP(),EP()];
  return tree;
}

function GedcomModal({onImport,onClose}){
  const [inds,setInds]=useState(null);
  const [fams,setFams]=useState(null);
  const [selId,setSelId]=useState("");
  const [err,setErr]=useState("");
  const [parsing,setParsing]=useState(false);

  const handleFile=e=>{
    const f=e.target.files[0];if(!f)return;
    setParsing(true);setErr("");
    const r=new FileReader();
    r.onload=ev=>{try{const{inds:i,fams:fa}=parseGED(ev.target.result);setInds(i);setFams(fa);const first=Object.keys(i)[0];if(first)setSelId(first);setParsing(false);}catch(ex){setErr("Erreur lecture GEDCOM.");setParsing(false);}};
    r.readAsText(f,"UTF-8");
  };

  const doImport=()=>{if(!selId||!inds)return;const tree=gedToTree(inds,fams,selId);const p=inds[selId];onImport(tree,((p.prenom||"")+" "+(p.nom||"")).trim());};
  const list=inds?Object.values(inds).filter(p=>p.prenom||p.nom).sort((a,b)=>(a.prenom||"").localeCompare(b.prenom||"")):[];

        <div style={{marginBottom:16}}>

        </div>
        {parsing&&<p style={{color:"#A66A3F",fontSize:13,fontStyle:"italic"}}>Lecture…</p>}
        {err&&<p style={{color:"#C0392B",fontSize:13}}>{err}</p>}
        {list.length>0&&<div style={{marginBottom:16}}>
          <label style={lS}>{list.length} personnes — Choisir la personne centrale :</label>
          <select value={selId} onChange={e=>setSelId(e.target.value)} style={{...iS(),marginTop:4}}>
            {list.map(p=><option key={p.id} value={p.id}>{p.prenom} {p.nom} {p.dateNaissance?"("+p.dateNaissance+")":""}</option>)}
          </select>
        </div>}

}

        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
          <button onClick={()=>setShowApiKey(!showApiKey)} style={{background:"none",border:"1px solid rgba(255,255,255,0.3)",color:"rgba(247,243,238,0.8)",padding:"4px 10px",borderRadius:12,cursor:"pointer",fontSize:11}}>⚙️ Clé API</button>
          <button onClick={()=>setMode("accueil")} style={{background:"none",border:"1px solid rgba(255,255,255,0.3)",color:"rgba(247,243,238,0.7)",padding:"5px 12px",borderRadius:14,cursor:"pointer",fontSize:11}}>Déconnexion</button>
        </div>
      </div>
      {showApiKey&&<div style={{background:"#FFF9F4",borderBottom:"1px solid #EDE7DC",padding:"10px 16px",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:12,color:"#8A6A60"}}>Clé API Anthropic :</span>
        <input type="password" value={apiKey} onChange={e=>{setApiKey(e.target.value);localStorage.setItem("sylvia_api_key",e.target.value);}} placeholder="sk-ant-..." style={{...iS(),maxWidth:340,fontSize:12}}/>
        <button onClick={()=>setShowApiKey(false)} style={{...bB(),padding:"6px 14px",fontSize:12}}>OK</button>
      </div>}

      <div style={{display:"flex",maxWidth:960,margin:"0 auto"}}>
        {/* Sidebar */}
        <div style={{width:200,minWidth:200,borderRight:"1px solid #EDE7DC",minHeight:"calc(100vh - 52px)",padding:"14px 12px",background:"#faf7f3"}}>
          <div style={{fontSize:11,color:"#8A6A60",letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Mes clientes</div>
          <button onClick={()=>setShowNew(true)} style={{width:"100%",background:"#A66A3F",color:"#F7F3EE",border:"none",padding:"8px 0",borderRadius:8,cursor:"pointer",fontSize:12,marginBottom:10}}>+ Nouvelle cliente</button>
          {showNew&&<div style={{marginBottom:12}}>
            <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&createClient()} placeholder="Prénom" autoFocus style={{...iS(),marginBottom:6,fontSize:12}}/>
            <input type="password" value={newPwd} onChange={e=>setNewPwd(e.target.value)} placeholder="Mot de passe (optionnel)" style={{...iS(),marginBottom:6,fontSize:12}}/>
            <div style={{display:"flex",gap:6}}>
              <button onClick={createClient} style={{flex:1,background:"#5A2E2A",color:"#F7F3EE",border:"none",padding:"6px 0",borderRadius:6,cursor:"pointer",fontSize:11}}>Créer</button>
              <button onClick={()=>setShowNew(false)} style={{flex:1,background:"#EDE7DC",border:"none",padding:"6px 0",borderRadius:6,cursor:"pointer",fontSize:11}}>Annuler</button>
            </div>
          </div>}
          {clients.length===0&&<p style={{fontSize:12,color:"#8A6A60",fontStyle:"italic"}}>Aucune cliente encore.</p>}
          {clients.map(c=>(
            <div key={c.id} onClick={()=>{
              if(c.motDePasse){const pwd=prompt("Mot de passe : "+c.nom);if(pwd!==c.motDePasse){alert("Incorrect.");return;}}
              setActiveId(c.id);setPratTab("arbre");setAnalysis(c.analysis||null);
            }} style={{padding:"8px 10px",borderRadius:8,marginBottom:6,cursor:"pointer",background:activeId===c.id?"#5A2E2A":"transparent",color:activeId===c.id?"#F7F3EE":"#2C1A18",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:13}}>{c.motDePasse?"🔒 ":""}{c.nom}</div>
                <div style={{fontSize:10,opacity:0.7}}>{c.createdAt}{c.submittedByClient?" ✉️":""}{c.analysis?" ✓":""}{c.notes&&c.notes.length?" "+c.notes.length+"📝":""}{c.seances&&c.seances.length?" "+c.seances.length+"📅":""}</div>
              </div>
              <button onClick={e=>{e.stopPropagation();if(window.confirm("Supprimer "+c.nom+" ?"))delClient(c.id);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:14,opacity:0.5,color:"inherit"}}>🗑</button>
            </div>
          ))}
          <div style={{marginTop:20,borderTop:"1px solid #EDE7DC",paddingTop:14}}>
            <div style={{fontSize:11,color:"#8A6A60",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>Cabinet</div>
            <button onClick={()=>{setActiveId(null);setPratTab("stats");}} style={{width:"100%",background:"none",border:"1px solid #EDE7DC",color:"#5A2E2A",padding:"6px 0",borderRadius:8,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>📊 Statistiques</button>
          </div>
        </div>

        {/* Zone principale */}
        <div style={{flex:1,minWidth:0}}>
          {!active&&pratTab!=="stats"?(
            <div style={{textAlign:"center",padding:"60px 24px",color:"#8A6A60",fontStyle:"italic"}}>Sélectionne une cliente ou crée un nouveau dossier.</div>
          ):pratTab==="stats"?(
            <StatsView clients={clients}/>
          ):(
            <>
              <div style={{padding:"10px 14px",borderBottom:"1px solid #EDE7DC",background:"#fff",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div>
                  <div style={{fontSize:15,color:"#5A2E2A"}}>{active&&active.nom}</div>
                  <div style={{fontSize:11,color:"#8A6A60"}}>{active&&active.createdAt}</div>
                </div>
                <div style={{marginLeft:"auto",display:"flex",gap:4,flexWrap:"wrap"}}>
                  <button onClick={()=>setShowGedcom(true)} style={{padding:"5px 10px",borderRadius:12,border:"1px solid #A66A3F",cursor:"pointer",fontSize:11,background:"#FFF9F4",color:"#A66A3F",fontFamily:"inherit"}}>📂 GEDCOM</button>
                  <button onClick={()=>exportPDF(active)} style={{padding:"5px 10px",borderRadius:12,border:"none",cursor:"pointer",fontSize:11,background:"#5A2E2A",color:"#F7F3EE",fontFamily:"inherit"}}>⬇ PDF</button>
                  {tabs.map(([t,lbl])=><button key={t} onClick={()=>setPratTab(t)} style={{padding:"5px 10px",borderRadius:12,border:"none",cursor:"pointer",fontSize:11,background:pratTab===t?"#C4904F":"#EDE7DC",color:pratTab===t?"#F7F3EE":"#2C1A18",fontFamily:"inherit",whiteSpace:"nowrap"}}>{lbl}</button>)}
                </div>
              </div>
              {pratTab==="arbre"&&<div style={{maxWidth:640,margin:"0 auto",padding:"14px 12px"}}>
                {GKEYS.map((gk,gi)=><GenSection key={gk} genKey={gk} label={GENS[gi]} persons={active&&active.tree&&active.tree[gk]||[]} expanded={expandedGen===gk} onToggle={()=>setExpandedGen(expandedGen===gk?null:gk)} onUpdate={updTree} onToggleMaladie={togM} onAdd={()=>addP(gk)} onRemove={id=>rmP(gk,id)} editingId={editingId} setEditingId={setEditingId}/>)}
                {active&&<ProjetSens data={(active.tree&&active.tree.projetSens)||{}} onUpdate={updPS}/>}
                <div style={{textAlign:"center",marginTop:20}}><button onClick={runAnalysis} style={{...bB(),padding:"12px 30px",borderRadius:24,fontSize:14,fontStyle:"italic"}}>✨ Analyser les patterns transgénérationnels</button></div>
              </div>}
              {pratTab==="analyse"&&<AnalyseView analysis={analysis} loading={loadingAI} onRetry={runAnalysis}/>}
              {pratTab==="prenom"&&<PrenomView client={active} apiKey={apiKey}/>}
              {pratTab==="notes"&&<NotesView client={active} onAdd={addNote} onDelete={delNote}/>}
              {pratTab==="seances"&&<SeancesView client={active} onAdd={addSeance} onDelete={delSeance}/>}
              {pratTab==="cr"&&<CRView client={active} apiKey={apiKey}/>}
            </>
          )}
        </div>
      </div>
      {showGedcom&&<GedcomModal onClose={()=>setShowGedcom(false)} onImport={(tree,nom)=>{
        if(activeId){setClients(prev=>prev.map(c=>c.id===activeId?{...c,tree}:c));}
        else{const c={id:crypto.randomUUID(),nom,createdAt:new Date().toLocaleDateString("fr-FR"),tree,analysis:null,notes:[],seances:[]};setClients(prev=>[c,...prev]);setActiveId(c.id);}
        setShowGedcom(false);setPratTab("arbre");
      }}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
